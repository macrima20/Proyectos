<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Proyectos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IM+Fell+English+SC&family=EB+Garamond&display=swap">
<style>
  :root{color-scheme:light; --paper:#e8dab7; --ink:#2f2418; --ink2:#5b4733}
  body{margin:0; min-height:100vh; background:var(--paper); color:var(--ink); font-family:"EB Garamond",Georgia,serif; font-size:18px; display:grid; place-items:center; padding:24px 16px; box-sizing:border-box}
  main{max-width:640px; width:100%}
  h1{font-family:"IM Fell English SC",Georgia,serif; font-weight:400; font-size:44px; margin:0 0 6px; border-bottom:3px double var(--ink)}
  p{color:var(--ink2)}
  a.card{display:block; margin-top:20px; padding:18px 20px; background:#f4ead0; border:1.5px solid var(--ink); color:var(--ink); text-decoration:none}
  a.card:hover{background:#fff8e4}
  a.card strong{font-family:"IM Fell English SC",Georgia,serif; font-weight:400; font-size:26px; display:block}
</style>
</head>
<body>
<main>
  <h1>Proyectos</h1>
  <p>Aquí van mis proyectos hasta la fecha.</p>
  <a class="card" href="colombia-siglo-xx/"><strong>Colombia en el Siglo XX</strong>Atlas de clase: mapa interactivo en estilo de carta antigua, cronología 1900–2000 y dinámicas de 20 minutos por sesión.</a>
</main>
</body>
</html>
